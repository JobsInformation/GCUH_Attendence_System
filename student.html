<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCUH Student Attendance Check-In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6 flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-8">
        <h1 class="text-xl font-bold text-gray-800 mb-1 text-center">Government College University Hyderabad</h1>
        <p class="text-xs text-gray-500 mb-6 text-center">Student Attendance Portal & Scanner</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Student Roll Number</label>
                <input type="text" id="studentRoll" placeholder="e.g. MSIT-2026-01" class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Camera QR Scanner Section -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-gray-700">Scan Teacher's QR Code</label>
                    <button onclick="startScanner()" class="text-xs bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-gray-700 font-medium">📷 Open Camera</button>
                </div>
                <div id="reader" class="w-full rounded-lg overflow-hidden border bg-black min-h-[50px]"></div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Scanned / Active Token</label>
                <input type="text" id="scannedToken" placeholder="Will populate automatically upon scan" class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm bg-gray-50" readonly>
            </div>

            <button onclick="submitAttendance()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition shadow">
                ✅ Submit Attendance
            </button>
        </div>

        <div id="statusMessage" class="mt-6 text-center text-sm font-medium"></div>
    </div>

    <script>
        const BACKEND_URL = "";
        let html5QrCode = null;

        function startScanner() {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = "mt-6 text-center text-sm font-medium text-blue-600";
            statusDiv.innerText = "Requesting camera access...";

            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText, decodedResult) => {
                    // Success callback
                    document.getElementById('scannedToken').value = decodedText;
                    statusDiv.className = "mt-6 text-center text-sm font-medium text-green-600";
                    statusDiv.innerText = "QR Code captured successfully! Click Submit.";
                    
                    // Optional: stop scanner after successful scan
                    html5QrCode.stop().catch(err => console.error("Failed to stop scanner", err));
                },
                (errorMessage) => {
                    // Scanning error (ignored during active search)
                }
            ).catch(err => {
                console.error("Camera permission error:", err);
                statusDiv.className = "mt-6 text-center text-sm font-medium text-red-500";
                statusDiv.innerText = "Camera access denied or unavailable. Please check permissions.";
            });
        }

        async function submitAttendance() {
            const studentRoll = document.getElementById('studentRoll').value.trim();
            const token = document.getElementById('scannedToken').value.trim();
            const statusDiv = document.getElementById('statusMessage');

            if (!studentRoll || !token) {
                statusDiv.className = "mt-6 text-center text-sm font-medium text-red-500";
                statusDiv.innerText = "Please enter your Roll Number and scan the active QR code.";
                return;
            }

            try {
                const res = await fetch(`/api/attendance/check-in`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json", 
                        "ngrok-skip-browser-warning": "true" 
                    },
                    body: JSON.stringify({ student_roll: studentRoll, token: token })
                });

                const data = await res.json();
                
                if (res.ok && data.status === "success") {
                    statusDiv.className = "mt-6 text-center text-sm font-medium text-green-600";
                    statusDiv.innerText = data.message;
                } else {
                    statusDiv.className = "mt-6 text-center text-sm font-medium text-red-500";
                    statusDiv.innerText = data.detail || "Check-in failed. Token may have expired.";
                }
            } catch (err) {
                console.error("Check-in Error:", err);
                statusDiv.className = "mt-6 text-center text-sm font-medium text-red-500";
                statusDiv.innerText = "Network error connecting to backend.";
            }
        }
    </script>
</body>
</html>
