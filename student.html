<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCUH Student Attendance Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Html5-Qrcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-gray-100 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-1">
            <h1 class="text-xl font-bold text-gray-800">Government College University Hyderabad</h1>
            <p class="text-sm text-gray-500">Student Attendance Portal & QR Scanner</p>
        </div>

        <!-- Camera Scanner Section -->
        <div class="space-y-2">
            <button type="button" onclick="startScanner()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm flex items-center justify-center space-x-2">
                <span>📷 Scan QR with Camera</span>
            </button>
            <div id="reader" class="w-full rounded-xl overflow-hidden hidden border border-gray-200"></div>
        </div>

        <!-- Check-in Form -->
        <form id="attendanceForm" onsubmit="submitAttendance(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Roll Number</label>
                <input type="text" id="rollNumber" required placeholder="e.g. BSIT-2024-001" oninput="fetchStudentDetails()" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono uppercase">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
                <input type="text" id="studentName" required placeholder="Auto-populated from database roster" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 text-gray-700 font-medium" readonly>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Department</label>
                <input type="text" id="department" value="Information Technology" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 text-gray-700" readonly>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Secure Token (from QR)</label>
                <input type="text" id="secureToken" required placeholder="Scanned token will appear here" class="w-full border border-gray-300 rounded-lg p-3 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors shadow-md">
                ✅ Submit Attendance
            </button>
        </form>

        <!-- Status Message -->
        <div id="statusMessage" class="text-center text-sm font-medium hidden"></div>
    </div>

    <script>
        let html5QrCode = null;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenParam = urlParams.get('token');
            if (tokenParam) {
                document.getElementById('secureToken').value = tokenParam;
            }
        };

        function startScanner() {
            const readerDiv = document.getElementById('reader');
            readerDiv.classList.remove('hidden');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText, decodedResult) => {
                    // Success callback when QR is scanned
                    document.getElementById('secureToken').value = decodedText;
                    
                    // Stop scanner after successful scan
                    html5QrCode.stop().then(() => {
                        readerDiv.classList.add('hidden');
                    }).catch(err => console.error("Failed to stop scanner.", err));
                },
                (errorMessage) => {
                    // Scanning error or searching frame (safe to ignore)
                }
            ).catch(err => {
                console.error("Unable to start scanning.", err);
                alert("Camera access denied or unavailable. Please check mobile browser permissions.");
            });
        }

        async function fetchStudentDetails() {
            const rollNo = document.getElementById('rollNumber').value.trim();
            const nameField = document.getElementById('studentName');
            const deptField = document.getElementById('department');

            if (rollNo.length < 5) {
                nameField.value = "";
                return;
            }

            try {
                const res = await fetch(`/api/student/lookup/${encodeURIComponent(rollNo)}`);
                const data = await res.json();
                if (data.found) {
                    nameField.value = data.name;
                    deptField.value = data.department;
                } else {
                    nameField.value = "Roll Number not found in roster";
                }
            } catch (err) {
                console.error("Lookup error:", err);
            }
        }

        async function submitAttendance(event) {
            event.preventDefault();
            const rollNumber = document.getElementById('rollNumber').value.trim();
            const name = document.getElementById('studentName').value.trim();
            const department = document.getElementById('department').value.trim();
            const token = document.getElementById('secureToken').value.trim();
            const statusEl = document.getElementById('statusMessage');

            statusEl.classList.remove('hidden', 'text-green-600', 'text-red-600');
            statusEl.innerText = "Submitting attendance...";
            statusEl.className = "text-center text-sm font-medium text-blue-600";

            try {
                const res = await fetch('/api/attendance/check-in', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roll_number: rollNumber, name: name, department: department, token: token })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Check-in failed");

                statusEl.innerText = "🎉 Attendance marked successfully!";
                statusEl.className = "text-center text-sm font-medium text-green-600";
            } catch (err) {
                console.error("Check-in Error:", err);
                statusEl.innerText = `❌ Error: ${err.message}`;
                statusEl.className = "text-center text-sm font-medium text-red-600";
            }
        }
    </script>
</body>
</html>
