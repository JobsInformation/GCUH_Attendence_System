<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCUH Teacher Dashboard - Dynamic QR Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Government College University Hyderabad</h1>
        <p class="text-sm text-gray-500 mb-6">Enterprise Staff Portal (RBAC v3.0)</p>

        <!-- Configuration Inputs -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Teacher ID</label>
                <input type="text" id="teacherId" value="IT-Instructor-01" class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Lecture ID</label>
                <input type="text" id="lectureId" value="" placeholder="Auto-generated on start" class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-green-500">
            </div>
        </div>

        <!-- Action Button -->
        <button onclick="startLectureSession()" class="w-full bg-green-600 text-white font-semibold py-3 rounded-lg hover:bg-green-700 transition shadow">
            🚀 Start Lecture & Generate Dynamic QR
        </button>

        <!-- QR Display Section -->
        <div class="mt-8 flex flex-col items-center justify-center border-2 border-dashed border-gray-200 rounded-xl p-6">
            <h3 class="text-lg font-medium text-gray-700 mb-2">Active Secure Token (Rotation)</h3>
            
            <!-- Token Text Display -->
            <div id="tokenDisplay" class="font-mono text-xs bg-gray-100 px-3 py-1 rounded text-gray-600 mb-4 tracking-wide">Waiting for token...</div>
            
            <div id="qrContainer" class="w-64 h-64 bg-gray-100 flex items-center justify-center rounded-lg mb-4">
                <span class="text-gray-400 text-sm">QR Code will appear here</span>
            </div>
            <div id="timerText" class="text-sm text-gray-500">System Ready</div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://chloride-landfill-conceded.ngrok-free.dev";
        let rotationInterval = null;
        let currentLectureId = null;

        async function startLectureSession() {
            try {
                // 1. Initialize lecture on backend
                const startRes = await fetch(`${BACKEND_URL}/lecture/start`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json", 
                        "ngrok-skip-browser-warning": "true" 
                    },
                    body: JSON.stringify({ teacherId: document.getElementById('teacherId').value })
                });

                if (!startRes.ok) throw new Error("Failed to start lecture");
                const startData = await startRes.json();
                
                currentLectureId = startData.lecture_id;
                document.getElementById('lectureId').value = currentLectureId;

                // 2. Fetch initial QR token immediately
                fetchAndRenderQR(currentLectureId);

                // 3. Setup 10-second secure token rotation loop
                if (rotationInterval) clearInterval(rotationInterval);
                let timeLeft = 10;
                
                rotationInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timerText').innerText = `Refreshing in ${timeLeft}s...`;
                    if (timeLeft <= 0) {
                        fetchAndRenderQR(currentLectureId);
                        timeLeft = 10;
                    }
                }, 1000);

            } catch (err) {
                console.error("Lecture Start Error:", err);
                alert("Error starting lecture: Check backend connection");
            }
        }

        async function fetchAndRenderQR(lectureId) {
            try {
                const res = await fetch(`${BACKEND_URL}/lecture/${lectureId}/token`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                if (!res.ok) throw new Error("Token fetch failed");
                const data = await res.json();

                // Update both the QR image and the text token display
                document.getElementById('qrContainer').innerHTML = `<img src="${data.qr_image}" alt="Dynamic QR" class="w-full h-full object-contain">`;
                document.getElementById('tokenDisplay').innerText = `Token: ${data.token}`;
            } catch (err) {
                console.error("QR Fetch Error:", err);
                document.getElementById('qrContainer').innerHTML = `<span class="text-red-500 text-xs">Connection Error</span>`;
            }
        }
    </script>
</body>
</html>
