<!DOCTYPE html>
<html lang="en">
<head>
<!-- NGROK BYPASS PATCH: Paste this exactly as-is -->
<script>
  (function() {
      // 1. Automatically inject the bypass header into all fetch() requests
      const originalFetch = window.fetch;
      window.fetch = async function(resource, config = {}) {
          config = config || {};
          config.headers = config.headers || {};
          config.headers["ngrok-skip-browser-warning"] = "true";
          return originalFetch(resource, config);
      };

      // 2. Automatically force credentials on EventSource (Live Stream)
      // This ensures the browser sends the Ngrok authorization cookie
      const OriginalEventSource = window.EventSource;
      window.EventSource = function(url, config = {}) {
          config = config || {};
          config.withCredentials = true;
          return new OriginalEventSource(url, config);
      };
  })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCUH Teacher Dashboard - Dynamic QR Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header Card -->
        <div class="bg-white rounded-xl shadow-md p-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Government College University Hyderabad</h1>
            <p class="text-sm text-gray-500 mb-6">Enterprise Staff Portal & Live Attendance Monitor</p>

            <!-- Configuration Inputs -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Teacher ID</label>
                    <input type="text" id="teacherId" value="IT-Instructor-01" class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Lecture ID</label>
                    <input type="text" id="lectureId" value="" placeholder="Auto-generated on start" class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-green-500 bg-gray-50" readonly>
                </div>
            </div>

            <!-- Action Button -->
            <button onclick="startLectureSession()" class="w-full bg-green-600 text-white font-semibold py-3 rounded-lg hover:bg-green-700 transition shadow">
                🚀 Start Lecture & Generate Dynamic QR
            </button>
        </div>

        <!-- Grid Layout: QR Code & Live Attendance Feed -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- QR Display Card -->
            <div class="bg-white rounded-xl shadow-md p-6 flex flex-col items-center justify-center border-2 border-dashed border-gray-200">
                <h3 class="text-lg font-medium text-gray-700 mb-2">Active Secure Token</h3>
                <div id="tokenDisplay" class="font-mono text-xs bg-gray-100 px-3 py-1 rounded text-gray-600 mb-4 tracking-wide">Waiting for session...</div>
                
                <div id="qrContainer" class="w-56 h-56 bg-gray-100 flex items-center justify-center rounded-lg mb-4">
                    <span class="text-gray-400 text-sm">QR Code will appear here</span>
                </div>
                <div id="timerText" class="text-sm text-gray-500">System Ready</div>
            </div>

            <!-- Live Attendance Roster Card -->
            <div class="bg-white rounded-xl shadow-md p-6 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center space-x-2">
                        <h3 class="text-lg font-medium text-gray-700">Live Attendance Feed</h3>
                        <span id="attendeeCount" class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">0 Present</span>
                    </div>
                    <button onclick="downloadAttendanceCSV()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition shadow">
                        📥 Export CSV
                    </button>
                </div>
                
                <div class="border rounded-lg overflow-y-auto max-h-64 flex-1 bg-gray-50">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-100 text-xs text-gray-600 sticky top-0">
                            <tr>
                                <th class="p-3">Roll Number</th>
                                <th class="p-3">Name</th>
                                <th class="p-3">Time</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody" class="text-xs text-gray-700 divide-y">
                            <tr>
                                <td colspan="3" class="p-4 text-center text-gray-400">No students checked in yet.</td>
                            </tr>
                        </tbody>
