<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCUH Teacher Attendance Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Html5-Qrcode Scanner Library for Generating QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Top Header -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-gray-800">GCUH Teacher Portal</h1>
                <p class="text-sm text-gray-500">Government College University Hyderabad</p>
            </div>
            <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-4 py-2 rounded-xl transition-colors text-sm">
                🚪 Logout
            </button>
        </div>

        <!-- Lecture Control Card -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h2 class="text-lg font-semibold text-gray-800">Active Lecture Session</h2>
                    <p id="lectureStatus" class="text-sm text-gray-500">No active lecture started.</p>
                </div>
                <button onclick="startLecture()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition-colors shadow-sm">
                    🚀 Start New Lecture & Generate QR
                </button>
            </div>

            <!-- QR Code Display Area -->
            <div id="qrContainer" class="hidden flex flex-col items-center justify-center p-6 bg-gray-50 rounded-xl border border-dashed border-gray-300 space-y-3">
                <div id="qrcode" class="bg-white p-4 rounded-xl shadow-sm"></div>
                <p class="text-xs text-gray-500 font-mono text-center">Scan this rotating secure token using the student portal.</p>
            </div>
        </div>

        <!-- Live Attendance Feed Card -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-800">Live Attendance Feed (<span id="attendanceCount">0</span>)</h3>
                <button onclick="fetchAttendance()" class="text-blue-600 hover:text-blue-700 text-sm font-semibold">
                    🔄 Refresh Feed
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase">
                            <th class="p-3">Roll Number</th>
                            <th class="p-3">Student Name</th>
                            <th class="p-3">Department</th>
                            <th class="p-3">Time Marked</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody" class="divide-y divide-gray-100 text-sm text-gray-700">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-gray-400">Start a lecture to view live attendance.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let currentLectureId = null;
        let tokenInterval = null;

        // Check authentication on load
        window.onload = function() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'index.html';
            }
        };

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = 'index.html';
        }

        async function apiCall(url, options = {}) {
            const res = await fetch(url, options);
            if (res.status === 401) {
                // Session expired or unauthorized
                localStorage.removeItem('access_token');
                alert("Session expired. Please log in again.");
                window.location.href = 'index.html';
                throw new Error("Unauthorized");
            }
            return res;
        }

        async function startLecture() {
            try {
                const res = await apiCall('/api/lecture/start', { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    currentLectureId = data.lecture_id;
                    document.getElementById('lectureStatusinnerText') = `Active Lecture: ${currentLectureId}`;
                    document.getElementById('qrContainer').classList.remove('hidden');
                    
                    displayQRCode(data.secure_token);
                    
                    // Refresh token every 10 seconds for security rotation
                    if (tokenInterval) clearInterval(tokenInterval);
                    tokenInterval = setInterval(() => rotateToken(currentLectureId), 10000);

                    // Start polling attendance
                    setInterval(fetchAttendance, 5000);
                }
            } catch (err) {
                console.error("Error starting lecture:", err);
            }
        }

        async function rotateToken(lectureId) {
            try {
                const res = await apiCall(`/api/lecture/${lectureId}/token`);
                const data = await res.json();
                if (data.success) {
                    displayQRCode(data.token);
                }
            } catch (err) {
                console.error("Error rotating token:", err);
            }
        }

        function displayQRCode(tokenText) {
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), {
                text: tokenText,
                width: 200,
                height: 200
            });
        }

        async function fetchAttendance() {
            if (!currentLectureId) return;

            try {
                const res = await apiCall(`/api/teacher/reports/${currentLectureId}`);
                const data = await res.json();

                if (data.success) {
                    const tbody = document.getElementById('attendanceTableBody');
                    document.getElementById('attendanceCount').innerText = data.count;

                    if (data.attendance_list.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">Waiting for students to check in...</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = data.attendance_list.map(row => `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 font-mono font-semibold text-blue-600">${row.roll_number}</td>
                            <td class="p-3 font-medium">${row.name}</td>
                            <td class="p-3 text-gray-500">${row.department}</td>
                            <td class="p-3 text-gray-400 text-xs">${row.time}</td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error("Error fetching attendance:", err);
            }
        }
    </script>
</body>
</html>
